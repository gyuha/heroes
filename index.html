<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Heroes — 갈대 여울</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1c232b;
      }
      #app {
        position: fixed;
        inset: 0;
      }
      /* 로딩 화면: mountUi()가 지운다. 그 전에 오류가 나면 문구를 바꿔 보여 준다. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #1c232b;
        color: #e6dcc4;
        font:
          600 16px/1.5 'Pretendard',
          'Apple SD Gothic Neo',
          'Malgun Gothic',
          'Noto Sans KR',
          system-ui,
          sans-serif;
      }
      #boot .bar {
        width: 220px;
        height: 4px;
        border-radius: 2px;
        background: rgba(230, 220, 196, 0.15);
        overflow: hidden;
      }
      #boot .bar::after {
        content: '';
        display: block;
        width: 40%;
        height: 100%;
        background: #e6dcc4;
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot.error .bar {
        display: none;
      }
      #boot .detail {
        max-width: 640px;
        color: #a2a49d;
        font-weight: 400;
        font-size: 14px;
        text-align: center;
        white-space: pre-wrap;
      }
      #boot.error .title {
        color: #ffb3aa;
      }
      @keyframes boot-slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(250%);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot" role="status" aria-live="polite">
      <div class="title">전장을 준비하는 중</div>
      <div class="bar"></div>
      <div class="detail"></div>
    </div>
    <script>
      // 시작 전 오류(WebGL 미지원, 맵 파일 누락 등)를 로딩 화면에 보여 준다.
      (function () {
        function fail(message) {
          var boot = document.getElementById('boot');
          if (!boot) return;
          boot.className = 'error';
          boot.querySelector('.title').textContent = '게임을 시작하지 못했습니다';
          boot.querySelector('.detail').textContent =
            String(message || '알 수 없는 오류') +
            '\n새로 고침해도 같으면 브라우저 콘솔 내용을 알려 주세요.';
        }
        window.addEventListener('error', function (e) {
          fail(e.message);
        });
        window.addEventListener('unhandledrejection', function (e) {
          fail(e.reason && e.reason.message ? e.reason.message : e.reason);
        });
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
